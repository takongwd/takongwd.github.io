name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every 1 hour (at minute 0)
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Query to Supabase
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "Error: VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret is not configured in this repository."
            exit 1
          fi
          
          echo "Pinging Supabase database to keep it active..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/albums?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 206 ] || [ "$response" -eq 401 ]; then
            echo "Successfully connected to Supabase (HTTP $response). Database is active!"
          else
            echo "Warning: Received HTTP status code $response from Supabase."
          fi
